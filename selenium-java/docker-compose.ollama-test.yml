# Adds the real analysis worker on top of the system-test stack (WITH_OLLAMA=true in scripts/sut-compose.sh).
services:
  ollama:
    deploy: !reset null

  backend:
    environment:
      - DISABLE_WORKER=false
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on: !override
      db:
        condition: service_healthy
      firebase-emulator:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
