services:
  ollama:
    image: ollama/ollama
    container_name: climanuvem_test_ollama
    volumes:
      - ollama_test_data:/root/.ollama
    networks:
      - climanuvem_test_net

  backend:
    environment:
      - DATABASE_URL=postgresql://testuser:testpassword@db:5432/climanuvem_test
      - TEST_MODE=true
      - TEST_TOKEN=test-token-climanuvem
      - TEST_USER_UID=test-user-e2e
      - FIREBASE_KEY_PATH=
      - DISABLE_WORKER=false
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  ollama_test_data:
