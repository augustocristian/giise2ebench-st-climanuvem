services:
  ollama:
    image: ollama/ollama
    container_name: climanuvem_test_ollama
    volumes:
      - ollama_test_data:/root/.ollama
    networks:
      - climanuvem_test_net

  backend:
    environment:
      - DISABLE_WORKER=false
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  ollama_test_data:
