services:
  db:
    image: postgres:15
    container_name: climanuvem_test_db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: climanuvem_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - climanuvem_test_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d climanuvem_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-climanuvem-backend:test}
    build: ../sut/backend
    container_name: climanuvem_test_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://testuser:testpassword@db:5432/climanuvem_test
      - TEST_MODE=true
      - TEST_TOKEN=test-token-climanuvem
      - TEST_USER_UID=test-user-e2e
      - FIREBASE_KEY_PATH=
      - DISABLE_WORKER=true
      - OLLAMA_URL=http://localhost:11434/api/generate
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - climanuvem_test_net

  frontend:
    image: ${FRONTEND_IMAGE:-climanuvem-frontend:test}
    build:
      context: ../sut/frontend
      args:
        - EXPO_PUBLIC_BACKEND_URL=http://localhost:${BACKEND_PORT:-8000}
        - EXPO_PUBLIC_DEFAULT_LANGUAGE=es
        - EXPO_PUBLIC_TEST_MODE=true
    container_name: climanuvem_test_frontend
    ports:
      - "5173:8081"
    environment:
      - EXPO_PUBLIC_BACKEND_URL=http://localhost:${BACKEND_PORT:-8000}
      - EXPO_PUBLIC_DEFAULT_LANGUAGE=es
      - EXPO_PUBLIC_TEST_MODE=true
      - EXPO_PUBLIC_FIREBASE_API_KEY=demo-api-key
      - EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-climanuvem.firebaseapp.com
      - EXPO_PUBLIC_FIREBASE_PROJECT_ID=demo-climanuvem
      - EXPO_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:demo
      - EXPO_PUBLIC_FIREBASE_AUTH_EMULATOR_URL=http://localhost:9099
      - CI=1
    depends_on:
      - backend
      - firebase-emulator
    networks:
      - climanuvem_test_net

  firebase-emulator:
    image: ${FIREBASE_EMULATOR_IMAGE:-climanuvem-firebase-emulator:test}
    build: ../sut/firebase-emulator
    container_name: climanuvem_test_firebase_emulator
    ports:
      - "9099:9099"
    networks:
      - climanuvem_test_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9099/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24

networks:
  climanuvem_test_net:

volumes:
  postgres_test_data:
