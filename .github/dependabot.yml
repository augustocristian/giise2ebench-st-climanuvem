# Dependabot configuration for giise2ebench-st-climanuvem.
#
# sut/ hosts two independently-versioned apps (FastAPI backend, Expo frontend) plus their
# Dockerfiles, and this repo's own GitHub Actions workflows live at the root.
#
# `groups` is used ONLY where packages are genuine version-lockstep siblings — bumping one
# without the other breaks the build/runtime until both catch up (the Expo SDK train, the
# React Navigation suite, the Pydantic/Starlette stack FastAPI pins against, the Firebase/
# Google Cloud dependency tree, SQLAlchemy+Alembic, etc.). It is deliberately NOT used just
# to bucket packages that happen to share a theme or ecosystem (e.g. "testing tools", "docs
# tools", "GitHub Actions") when there's no real compatibility constraint between them —
# those update and get reviewed independently, one PR per package.

version: 2
updates:
  # --- Backend: FastAPI service (sut/backend) ---
  - package-ecosystem: "pip"
    directory: "/sut/backend"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(backend deps)"
      prefix-development: "chore(backend dev-deps)"
    assignees:
      - "augustocristian"
    labels:
      - "backend"
      - "backend-ai"
    groups:
      fastapi-pydantic:
        # fastapi pins a compatible starlette range, and pydantic v2 ships pydantic_core
        # plus its own typing helpers as separate packages that must match minor-for-minor.
        patterns:
          - "fastapi"
          - "starlette"
          - "pydantic*"
          - "annotated-doc"
          - "annotated-types"
          - "typing-inspection"
      firebase-google-cloud:
        # firebase_admin depends on the google-cloud-* / google-auth / grpcio / protobuf
        # tree; bumping one without the others routinely breaks import-time compatibility.
        patterns:
          - "firebase*"
          - "google-*"
          - "google_*"
          - "googleapis-*"
          - "grpcio*"
          - "proto-plus"
          - "protobuf"
          - "pyasn1*"
      sqlalchemy:
        # alembic tracks the sqlalchemy major/minor it supports.
        patterns:
          - "sqlalchemy"
          - "alembic"
      http-stack:
        # httpx's transport (httpcore) and httpcore's http/2 support (h2 + hpack/hyperframe)
        # are released as a coordinated stack, with anyio underpinning both.
        patterns:
          - "httpx"
          - "httpcore"
          - "h11"
          - "h2"
          - "hpack"
          - "hyperframe"
          - "anyio"

  # --- Frontend: Expo / React Native app (sut/frontend) ---
  - package-ecosystem: "npm"
    directory: "/sut/frontend"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(frontend deps)"
      prefix-development: "chore(frontend dev-deps)"
    assignees:
      - "augustocristian"
    labels:
      - "frontend"
    groups:
      expo-sdk:
        # The Expo SDK pins compatible versions of every expo-* package plus react,
        # react-dom, react-native, and the react-native-* libs it manages (reanimated,
        # gesture-handler, safe-area-context, screens, worklets, web). `expo install`
        # always bumps these as one unit, so Dependabot should too. jest and jest-expo
        # are included here (not in `testing`) because jest-expo's own dependency tree
        # (and the react-native jest preset it wraps) is pinned to a specific jest major
        # and a specific react-native/SDK generation, not just to "a jest version" —
        # react-native 0.81->0.87 outrunning jest-expo broke `npm test` by dropping a
        # module jest-expo's preset still mocks unconditionally, and jest-expo's own
        # jest 29-pinned internals conflict with a standalone jest major bump.
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@types/react"
          - "jest"
          - "jest-expo"
      react-navigation:
        # @react-navigation/* packages are released together as a suite.
        patterns:
          - "@react-navigation/*"
      testing:
        # Type definitions only — no runtime coupling to the jest/jest-expo/
        # react-native versions grouped under expo-sdk above.
        patterns:
          - "@types/jest"
      linting:
        # eslint-config-expo pins the eslint range it supports, and its bundled
        # @typescript-eslint/* tooling in turn pins the typescript range it parses
        # (typescript ships its own dependent releases well ahead of what
        # @typescript-eslint supports — a bump here silently broke `npm run lint`
        # with typescript ~7.0.2 against @typescript-eslint/typescript-estree's
        # `>=4.8.4 <6.1.0` peer range). Keep typescript and @typescript-eslint/*
        # moving with eslint/eslint-config-expo as one reviewed unit.
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "typescript"
    ignore:
      # eslint-config-expo (57.x/58.x) bundles an eslint-plugin-react/-import that
      # breaks at runtime under ESLint 10's flat-config API. Revisit once
      # eslint-config-expo ships a release built against ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # These SDK-managed packages must match whatever version Expo's own
      # bundledNativeModules.json pins for the installed `expo` — Dependabot can't
      # read that table, and has twice picked an incompatible combo here (jest-expo
      # on the wrong SDK track; react-native 0.87.1 vs SDK 57's pinned 0.86.3), both
      # via ordinary minor releases. Only patches auto-update; bump the set by hand
      # with `npx expo install --fix` when moving to a new SDK.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # expo/expo-*/@expo/* version by SDK number, so a major bump means "move SDK" —
      # same reasoning, must move with the group above by hand.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]

  # --- Dockerfiles ---
  - package-ecosystem: "docker"
    directory: "/sut/backend"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(backend docker)"
    assignees:
      - "augustocristian"
    labels:
      - "backend"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/sut/frontend"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(frontend docker)"
    assignees:
      - "augustocristian"
    labels:
      - "frontend"
      - "docker"

  # --- GitHub Actions workflows (always read from .github/workflows at the repo root,
  #     regardless of where the code they build lives) ---
  # Intentionally ungrouped: unlike the pip/npm ecosystems above, no two actions in
  # ci-cd.yml have a version constraint on each other, so there's no "sibling" risk in
  # letting each one (actions/checkout, actions/setup-python, dorny/paths-filter, etc.)
  # update and get reviewed independently.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(ci)"
    assignees:
      - "augustocristian"
    labels:
      - "actions"
