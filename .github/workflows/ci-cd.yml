name: CI/CD

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build signed Android APK
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.flags.outputs.backend }}
      frontend: ${{ steps.flags.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721
        with:
          filters: |
            backend:
              - 'sut/backend/**'
            frontend:
              - 'sut/frontend/**'

      - name: Set execution flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sut/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: "2.4.0"
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --with test

      - name: Run pytest
        run: poetry run pytest

      - name: Archive logs
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-logs
          path: sut/backend/logs/*

  frontend-tests:
    name: Frontend lint and tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sut/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sut/frontend/package-lock.json

      - name: Restore Firebase Android config when available
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 is not set; continuing without google-services.json for lint/tests."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-tests
      - frontend-tests
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true')
    permissions:
      contents: read
    # Exposed at job level so steps can test whether the secret is configured.
    # Dependabot PRs and unconfigured forks get an empty value; the scan could
    # only fail with "Not authorized", so it is skipped with a warning instead.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: "2.4.0"
          virtualenvs-in-project: true

      - name: Install backend dependencies
        run: poetry install --no-interaction --with test
        working-directory: sut/backend

      - name: Run backend coverage
        run: poetry run pytest
        working-directory: sut/backend

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sut/frontend/package-lock.json

      - name: Restore Firebase Android config when available
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > sut/frontend/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 is not set; continuing without google-services.json for SonarCloud tests."
          fi

      - name: Install frontend dependencies
        run: npm ci
        working-directory: sut/frontend

      - name: Run frontend coverage
        run: npm run test:coverage
        working-directory: sut/frontend

      - name: Run SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: sut

      - name: Report missing Sonar token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning title=SonarCloud::SONAR_TOKEN is not configured - static analysis was skipped."

  deploy-docs:
    name: Generate & Publish Sphinx Docs
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: "2.4.0"
          virtualenvs-in-project: true

      - name: Install backend dependencies
        run: poetry install --no-interaction --with docs
        working-directory: sut/backend

      - name: Build documentation
        run: backend/.venv/bin/sphinx-build -b html docs docs/_build/html
        working-directory: sut

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: sut/docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  android-release-apk:
    name: Build signed Android APK and release
    runs-on: ubuntu-latest
    needs:
      - changes
      - frontend-tests
    if: |
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       needs.changes.outputs.frontend == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.build_android == true)
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
    defaults:
      run:
        working-directory: sut/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sut/frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON_BASE64 EXPO_PUBLIC_BACKEND_URL EXPO_PUBLIC_FIREBASE_API_KEY EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN EXPO_PUBLIC_FIREBASE_PROJECT_ID EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID EXPO_PUBLIC_FIREBASE_APP_ID EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is required to build the signed Android release APK."
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore private Android files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          cp google-services.json android/app/google-services.json

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.gradle"
          {
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: sut/frontend/android

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/climanuvem-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: climanuvem-release-apk
          path: sut/frontend/dist/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: frontend-v1.0.0-${{ github.run_number }}
          name: ClimaNuvem Frontend v1.0.0 build ${{ github.run_number }}
          body: |
            APK Android firmado generado automaticamente tras cambios en frontend.

            Commit: ${{ github.sha }}
          files: sut/frontend/dist/*.apk

  docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
      - sonarcloud
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: sut/backend
            build_args: ""
          - name: frontend
            context: sut/frontend
            build_args: |
              EXPO_PUBLIC_BACKEND_URL=http://localhost:8000
              EXPO_PUBLIC_DEFAULT_LANGUAGE=es
              EXPO_PUBLIC_TEST_MODE=true
          - name: firebase-emulator
            context: sut/firebase-emulator
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          tags: climanuvem-${{ matrix.name }}:test
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          retention-days: 1
          compression-level: 6

  e2e-selenium-java:
    name: "E2E: Selenium (Java)"
    runs-on: ubuntu-latest
    needs: docker-images
    permissions:
      contents: read
    env:
      BACKEND_IMAGE: climanuvem-backend:test
      FRONTEND_IMAGE: climanuvem-frontend:test
      FIREBASE_EMULATOR_IMAGE: climanuvem-firebase-emulator:test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download images
        uses: actions/download-artifact@v7
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Load images
        run: |
          for image in "$RUNNER_TEMP"/images/*.tar; do docker load --input "$image"; done

      - name: Start the SUT (prod compose + dev override + test override)
        working-directory: selenium-java
        run: ./scripts/sut-compose.sh up --detach --no-build db firebase-emulator backend frontend

      - name: Wait for backend, frontend and Firebase emulator
        run: |
          for service in "http://localhost:8000/ping" "http://localhost:5173" "http://localhost:9099"; do
            for _ in $(seq 1 60); do
              if curl --silent --fail --output /dev/null "$service"; then continue 2; fi
              sleep 5
            done
            echo "::error::$service did not become ready"
            selenium-java/scripts/sut-compose.sh logs
            exit 1
          done

      - name: Seed Firebase emulator accounts
        run: selenium-java/scripts/seed-firebase-emulator.sh

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: selenium-java/pom.xml

      - name: Run tests
        working-directory: selenium-java
        run: mvn --batch-mode test -DCI=true -DtestFailureIgnore=false

      - name: Show container logs on failure
        if: failure()
        run: selenium-java/scripts/sut-compose.sh logs

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-java-reports
          path: selenium-java/target/local/surefire-reports
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: selenium-java/scripts/sut-compose.sh down --volumes

  # Placeholders: no-op stages for the remaining tool/language combinations.

  e2e-playwright-csharp:
    name: "E2E: Playwright (C#) [placeholder]"
    runs-on: ubuntu-latest
    needs: docker-images
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Placeholder
        run: |
          echo "TODO: implement the Playwright + C# E2E suite for this stage."

  e2e-cypress-javascript:
    name: "E2E: Cypress (JavaScript) [placeholder]"
    runs-on: ubuntu-latest
    needs: docker-images
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Placeholder
        run: |
          echo "TODO: implement the Cypress + JavaScript E2E suite for this stage."

  e2e-puppeteer-python:
    name: "E2E: Puppeteer (Python) [placeholder]"
    runs-on: ubuntu-latest
    needs: docker-images
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Placeholder
        run: |
          echo "TODO: implement the Puppeteer + Python E2E suite for this stage."

  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs:
      - e2e-selenium-java
      - e2e-playwright-csharp
      - e2e-cypress-javascript
      - e2e-puppeteer-python
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download images
        uses: actions/download-artifact@v7
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load, tag and push images
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME//\//-}"
          for image in "$RUNNER_TEMP"/images/*.tar; do
            docker load --input "$image"
          done
          for name in backend frontend firebase-emulator; do
            for tag in "$version" "$GITHUB_SHA"; do
              docker tag "climanuvem-$name:test" "$repo/$name:$tag"
              docker push "$repo/$name:$tag"
            done
          done
