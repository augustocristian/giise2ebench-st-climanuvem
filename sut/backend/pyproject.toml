[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# This is a deployed FastAPI service, not a published library, so there is no
# wheel to build or install as a "root" package — Poetry only manages the
# dependency environment here.
package-mode = false

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
pytest-cov = "7.1.0"
pytest-mock = "3.15.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "8.1.3"
sphinx-rtd-theme = "3.1.0"

[project]
name = "climanuvem-backend"
version = "1.0.0"
description = "FastAPI backend for ClimaNuvem: cloud-photo analysis and short-term local weather forecasting."
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Fernando Uria Navarro" },
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" },
    { name = "Miguel Ángel Gallego Becerra" },
    { name = "Tomás Pérez Vellarino" },
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "sqlalchemy==2.0.53",
    "psycopg2-binary==2.9.13",
    "python-multipart==0.0.32",
    "alembic==1.20.0",
    "firebase-admin==7.5.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-dotenv==1.2.3",
    "anyio==4.15.1",
]

[project.urls]
Repository = "https://github.com/uo289165/epi-climanuvem"
Documentation = "https://urianf.github.io/epi-climanuvem/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = "."
addopts = "--cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-branch"

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
