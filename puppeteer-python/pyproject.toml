[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "climanuvem" }]

[project]
name = "puppeteer-st-climanuvem"
version = "1.0.0"
dependencies = [
    "setuptools==82.0.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "flake8==7.3.0",
    "pyppeteer>=2.0.0,<3.0.0",
    "requests>=2.32.5,<3.0.0",
    "pillow>=11.0.0,<13.0.0",
]

requires-python = ">=3.12,<4.0"

authors = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]
maintainers = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]

description = "Puppeteer (pyppeteer) + Python end-to-end test suite for EPI-ClimaNuvem"
readme = "README.md"
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://gitlab.com/HP-SCDS/Observatorio/2025-2026/climanuvem/epi-climanuvem"
Repository = "https://github.com/augustocristian/giise2ebench-st-climanuvem"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=climanuvem --cov-report=xml:coverage.xml --cov-branch"
#Configurations related to logging in testing, first
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
